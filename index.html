<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>YAKNWOOL Expense Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,Arial;color:#172033}.app{max-width:520px;margin:auto;padding-bottom:80px}header{background:white;padding:18px;position:sticky;top:0;z-index:2}h2{margin:0}.muted{color:#748093;font-size:12px}.card{background:#fff;margin:12px;padding:15px;border-radius:16px;box-shadow:0 2px 8px #0001}.bal{background:#087cf0;color:white;text-align:center;padding:20px;border-radius:16px}.bal b{display:block;font-size:30px;margin:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{text-align:center}.metric b{display:block;font-size:16px}.green{color:#16834b}.red{color:#dc3545}.orange{color:#d88700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:11px;padding:13px;background:#087cf0;color:white;font-weight:bold}.secondary{background:#e8f2ff;color:#087cf0}.view{display:none}.active{display:block}label{display:block;font-size:12px;margin:12px 0 5px;color:#687386}input,select,textarea{width:100%;padding:12px;border:1px solid #dce2ea;border-radius:10px;font-size:15px}textarea{min-height:70px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f4}.entry{display:flex;gap:10px;align-items:center}.icon{width:40px;height:40px;border-radius:12px;background:#edf4ff;display:grid;place-items:center}.main{flex:1}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:10px}.nav button{border:0;background:none;padding:6px;color:#687386}.nav .on{color:#087cf0;font-weight:bold}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="YAKNWOOL"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body><div class="app"><header><h2>YAKNWOOL</h2><span class="muted">Expense Manager · March 2026</span></header>
<main>
<section id="home" class="view active"><div class="card"><div class="bal"><span>Current Balance</span><b id="balance">₹25,289</b></div></div>
<div class="card grid"><div class="metric green"><b id="received">₹4,80,000</b><span class="muted">Received</span></div><div class="metric red"><b id="expense">₹4,20,000</b><span class="muted">Expense</span></div><div class="metric orange"><b id="advance">₹34,711</b><span class="muted">Advance</span></div></div>
<div class="actions card"><button class="btn" onclick="show('add')">＋ Add Entry</button><button class="btn secondary" onclick="show('add')">📷 Scan Bill</button></div>
<div class="card"><b>Expenses by Category</b><div id="cats"></div></div></section>

<section id="add" class="view"><div class="card"><h3>Add Entry</h3><label>Entry Type</label><select id="type"><option>Expense</option><option>Advance</option><option>Received</option></select><label>Date</label><input id="date" type="date" value="2026-03-11"><label>Description</label><input id="desc" placeholder="e.g. Sunil food allowance"><label>Person / Vendor</label><input id="person" placeholder="e.g. Sunil"><label>Category</label><select id="cat"></select><label>Amount</label><input id="amt" type="number" placeholder="0"><label>Payment Type</label><select id="pay"><option>Cash Advance</option><option>Cash</option><option>Bank Transfer</option><option>Card</option><option>UPI</option></select><label>Remarks</label><textarea id="remarks"></textarea><button class="btn" style="width:100%;margin-top:12px" onclick="save()">Save Entry</button></div></section>

<section id="entries" class="view"><div class="card"><h3>Entries</h3><input id="search" placeholder="Search..." oninput="renderEntries()"></div><div id="list"></div></section>
<section id="reports" class="view"><div class="card"><h3>Category Report</h3><div id="report"></div></div><div class="card"><h3>Advance Control</h3><div id="adv"></div></div></section>
</main><div class="nav"><button class="on" onclick="show('home',this)">⌂<br>Home</button><button onclick="show('entries',this)">☷<br>Entries</button><button onclick="show('reports',this)">▥<br>Reports</button></div></div>
<script>
const categories=['Investment / Received','Travel','Labour','Food','Tools & Equipment','Safety','Accommodation','Bank Charges','Electrical','Miscellaneous','Transfer'];
let data=[
['2026-03-10','Received','Investment / Received','AIR','Received from AIR',90000,'Bank Transfer'],
['2026-03-11','Expense','Travel','Sunil','Sunil flight to VSKP',4052,'Cash'],
['2026-03-11','Expense','Food','Sunil','Sunil food allowance',362,'Cash'],
['2026-03-11','Advance','Labour','Devendra','Labour mobility',1800,'Cash Advance'],
['2026-03-11','Expense','Accommodation','Sunil','Room transaction',1600,'Cash Advance'],
['2026-03-12','Received','Investment / Received','AIR','Received from AIR',60000,'Bank Transfer'],
['2026-03-12','Expense','Tools & Equipment','','Reliable tools',5000,'Cash']
];
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
cat.innerHTML=categories.map(x=>`<option>${x}</option>`).join('');
function render(){let r=data.filter(x=>x[1]=='Received').reduce((a,x)=>a+x[5],0),e=data.filter(x=>x[1]=='Expense').reduce((a,x)=>a+x[5],0),a=data.filter(x=>x[1]=='Advance').reduce((a,x)=>a+x[5],0);received.textContent=money(r);expense.textContent=money(e);advance.textContent=money(a);balance.textContent=money(r-e-a);let m={};data.filter(x=>x[1]!='Received').forEach(x=>m[x[2]]=(m[x[2]]||0)+x[5]);cats.innerHTML=Object.entries(m).map(x=>`<div class="row"><span>${x[0]}</span><b class="red">${money(x[1])}</b></div>`).join('');renderEntries();report.innerHTML=Object.entries(m).map(x=>`<div class="row"><span>${x[0]}</span><b>${money(x[1])}</b></div>`).join('');let p={};data.filter(x=>x[1]=='Advance').forEach(x=>p[x[3]||'Unassigned']=(p[x[3]||'Unassigned']||0)+x[5]);adv.innerHTML=Object.entries(p).map(x=>`<div class="row"><span>${x[0]}</span><b class="orange">${money(x[1])} pending</b></div>`).join('')||'<span class="muted">No advances</span>'}
function renderEntries(){let q=(search?.value||'').toLowerCase();list.innerHTML=data.filter(x=>(x.join(' ').toLowerCase().includes(q))).map(x=>`<div class="card entry"><div class="icon">${x[1]=='Received'?'💰':x[1]=='Advance'?'👤':'🧾'}</div><div class="main"><b>${x[4]}</b><div class="muted">${x[2]} · ${x[3]||'—'}</div></div><div><b class="${x[1]=='Received'?'green':'red'}">${x[1]=='Received'?'+':'−'}${money(x[5])}</b><div class="muted">${x[0]}</div></div></div>`).join('')}
function save(){let n=+amt.value;if(!n)return alert('Enter amount');data.unshift([date.value,type.value,cat.value,person.value,desc.value||cat.value,n,pay.value]);alert('Entry saved');show('entries');render()}
function show(id,el){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(el){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));el.classList.add('on')}render()}
render();
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js");}</script></body></html>
